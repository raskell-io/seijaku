# Demo config: raskell.io sample content rendered with the theme. `zola serve` in this directory.
base_url = "http://127.0.0.1:1111"
title = "Raskell"
description = "Writing about platform automation, edge systems, applied security, and open standards. Building automation-first platforms that survive production reality."
default_language = "en"
compile_sass = true
generate_feeds = true
feed_filenames = ["rss.xml"]
build_search_index = false

taxonomies = [
  { name = "tags", feed = true },
  { name = "categories", feed = true },
  { name = "series", feed = true },
]

[markdown]
smart_punctuation = true
highlighting = { enabled = true, theme = "nord" }

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra.seijaku]
version = "aw26"
tagline = "(tech web space curated by Raffael)"
footer_note = "made in Basel with 静寂"
portrait = "images/raffael.webp"   # circular portrait above the hero deck
mark = "images/raskell-mark.svg"     # monochrome inline SVG mark; inherits text colour
main_section = "articles"        # listed on the homepage
projects_section = "projects"    # featured projects strip on the homepage
cta = { name = "Start here", url = "@/start-here.md" }
nav = [
  { name = "Articles", url = "@/articles/_index.md" },
  { name = "Projects", url = "@/projects/_index.md" },
  { name = "Speaking", url = "@/speaking.md" },
  { name = "About", url = "@/about.md" },
]
explore = [
  { name = "Tags", url = "/tags" },
  { name = "Categories", url = "/categories" },
  { name = "Series", url = "/series" },
  { name = "RSS", url = "/rss.xml" },
]
social = [
  { name = "GitHub", url = "https://github.com/raffaelschneider" },
  { name = "X", url = "https://x.com/raskelll" },
  { name = "LinkedIn", url = "https://ch.linkedin.com/in/raffael-e-schneider" },
]
